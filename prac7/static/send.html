<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма с автоматическим отправлением данных</title>
    <script>
        let timeout = null;

        function sendRequest() {
            const inputField = document.getElementById('inputField');
            const data = {
                "value": inputField.value
            };

            fetch('http://localhost:8000/event_list', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Success:', data);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function onInputChange() {
            clearTimeout(timeout);
            timeout = setTimeout(sendRequest, 500);
        }
    </script>
</head>
<body>
    <h1>Введите данные:</h1>
    <input id="inputField" type="text" oninput="onInputChange()" placeholder="Введите информацию...">
</body>
</html>
